# ytmcross configuration
# Press F5 inside the app to reload this file and the active theme.

# Theme file to use, from the themes/ folder next to this file (without .toml).
theme = "default"

[window]
width = 1100
height = 720

[layout]
# Where the now-playing bar sits: "bottom" or "top".
bar_position = "bottom"
# Show the navigation sidebar.
sidebar = true
# Sidebar entries, in order. Available: "search", "library", "queue".
sidebar_items = ["search", "library", "queue"]

[player]
# Starting volume, 0-100.
volume = 80

[downloads]
# Folder for downloaded songs and playlists. Empty: downloads, next to this file.
# Also set from Preferences in the app.
folder = ""
