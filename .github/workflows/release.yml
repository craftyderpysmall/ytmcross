# Push a tag vX.Y.Z (matching Cargo.toml) to release: builds the Linux
# tarball and publishes it. Built on the oldest supported runner, as a binary
# runs on systems with this glibc or newer.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - name: Build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
          rustup toolchain install stable --profile minimal
          cargo build --release --locked
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="ytmcross-$GITHUB_REF_NAME-linux-x64"
          mkdir "$dir"
          cp target/release/ytmcross assets/ytmcross.desktop assets/ytmcross.svg LICENSE "$dir"
          tar czf "$dir.tar.gz" "$dir"
          gh release create "$GITHUB_REF_NAME" "$dir.tar.gz" --title "ytmcross $GITHUB_REF_NAME" --generate-notes
