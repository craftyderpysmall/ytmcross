[package]
name = "ytmcross"
version = "0.1.3"
edition = "2024"
description = "A minimal, fast, native YouTube Music client"
license = "MIT"
default-run = "ytmcross"

[dependencies]
dirs = "7.0.0"
# egui is drawn on the CPU instead of the GPU: the UI redraws rarely,
# and not loading a GPU driver saves ~80 MB of RAM. No bundled egui fonts: we ship Inter.
egui = { version = "0.34.3", default-features = false }
egui-winit = { version = "0.34.3", default-features = false, features = ["wayland", "x11"] }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }
winit = "0.30.13"
# Album art: JPEG, and PNG for a few icons.
png = "0.18.1"
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
# No logger is installed: compile every dependency's log/tracing call out.
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing = { version = "0.1", default-features = false, features = ["max_level_off", "release_max_level_off"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
flate2 = "1.1.10"
sha1 = "0.11.0"
tao = "0.37.1"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "3.4.2", features = ["json"] }
wry = "0.57.0"
# SIMD FFT for the AAC decoder: SSE is as fast here as SSE+AVX (measured)
# and AVX adds 280 KB. NEON on ARM, below.
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "opt-simd-sse"] }
cpal = "0.18.2"
rquickjs = { version = "0.14.0", features = ["allocator"] }
# Native (SWC) preprocessing of YouTube's player script; pinned to a tested commit.
# Only its SWC preprocessor is used: `external` is the one runtime feature with no dependencies.
ytdlp-ejs = { git = "https://github.com/anenasa/ytdlp-ejs", rev = "9d6fce40550e4846dd435498ed976e5488cdc693", default-features = false, features = ["external"] }

[build-dependencies]
flate2 = "1.1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Code that runs only in the short-lived helper processes (solver build,
# sign-in window): optimise for size, the main app never executes it.
[profile.release.package.ytdlp-ejs]
opt-level = "s"
[profile.release.package.swc_ecma_parser]
opt-level = "s"
[profile.release.package.swc_ecma_ast]
opt-level = "s"
[profile.release.package.swc_ecma_codegen]
opt-level = "s"
[profile.release.package.swc_ecma_utils]
opt-level = "s"
[profile.release.package.swc_ecma_visit]
opt-level = "s"
[profile.release.package.swc_common]
opt-level = "s"
[profile.release.package.wry]
opt-level = "s"
[profile.release.package.tao]
opt-level = "s"
# Also helper-only: SWC's regex and bignum dependencies.
[profile.release.package.regex]
opt-level = "s"
[profile.release.package.regex-automata]
opt-level = "s"
[profile.release.package.regex-syntax]
opt-level = "s"
[profile.release.package.aho-corasick]
opt-level = "s"
[profile.release.package.num-bigint]
opt-level = "s"
# Cold paths of the main app: TLS handshakes and record framing (the
# bulk crypto is ring's assembly), certificate checks, config parsing.
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.rustls-webpki]
opt-level = "s"
[profile.release.package.toml_parser]
opt-level = "s"
[profile.release.package.winnow]
opt-level = "s"
[profile.release.package.toml]
opt-level = "s"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

# Windows presents frames itself (ui/present.rs).
[target.'cfg(not(windows))'.dependencies]
bytemuck = "1"
softbuffer = "0.4.8"
# The clipboard, text only, connected on first use (ui/clipboard.rs): egui-winit's
# connects at startup and brings in an image codec stack.
arboard = { version = "3.6.1", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
smithay-clipboard = "0.7.2"

[target.'cfg(target_arch = "aarch64")'.dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd-neon"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
